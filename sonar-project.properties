sonar.projectKey=duyler_config
sonar.organization=duyler
sonar.projectName=Config
sonar.sources=src
sonar.sourceEncoding=UTF-8
sonar.php.coverage.reportPaths=coverage.xml
sonar.exclusions=vendor/**
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7

# require is correct for dynamic config loading (ConfigFileLoader)
sonar.issue.ignore.multicriteria.e1.ruleKey=php:S3334
sonar.issue.ignore.multicriteria.e1.resourceKey=src/ConfigFileLoader.php

# require is correct for cache loading (ConfigCache)
sonar.issue.ignore.multicriteria.e2.ruleKey=php:S3334
sonar.issue.ignore.multicriteria.e2.resourceKey=src/ConfigCache.php

# require is for loading config files, not classes (ConfigFileLoader)
sonar.issue.ignore.multicriteria.e3.ruleKey=php:S1008
sonar.issue.ignore.multicriteria.e3.resourceKey=src/ConfigFileLoader.php

# require is for loading cache files, not classes (ConfigCache)
sonar.issue.ignore.multicriteria.e4.ruleKey=php:S1008
sonar.issue.ignore.multicriteria.e4.resourceKey=src/ConfigCache.php

# RuntimeException is appropriate for config loading errors
sonar.issue.ignore.multicriteria.e5.ruleKey=php:S112
sonar.issue.ignore.multicriteria.e5.resourceKey=src/Config*.php

# $config parameter is used by required config files
sonar.issue.ignore.multicriteria.e6.ruleKey=php:S1172
sonar.issue.ignore.multicriteria.e6.resourceKey=src/ConfigFileLoader.php

# Temporary variables needed for Psalm type inference
sonar.issue.ignore.multicriteria.e7.ruleKey=php:S1488
sonar.issue.ignore.multicriteria.e7.resourceKey=src/**
