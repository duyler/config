sonar.projectKey=duyler_config
sonar.organization=duyler
sonar.projectName=Config
sonar.sources=src
sonar.sourceEncoding=UTF-8
sonar.php.coverage.reportPaths=coverage.xml
sonar.exclusions=vendor/**
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5

# Configuration files need to be reloadable, require is correct here
sonar.issue.ignore.multicriteria.e1.ruleKey=php:S3334
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.php

# RuntimeException is appropriate for config loading errors
sonar.issue.ignore.multicriteria.e2.ruleKey=php:S112
sonar.issue.ignore.multicriteria.e2.resourceKey=**/Config*.php

# Temporary variables needed for Psalm type inference
sonar.issue.ignore.multicriteria.e3.ruleKey=php:S1488
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.php

# $config parameter is used by required config files
sonar.issue.ignore.multicriteria.e4.ruleKey=php:S1172
sonar.issue.ignore.multicriteria.e4.resourceKey=**/ConfigFileLoader.php

# require is for loading config files, not classes
sonar.issue.ignore.multicriteria.e5.ruleKey=php:S1008
sonar.issue.ignore.multicriteria.e5.resourceKey=**/*.php
